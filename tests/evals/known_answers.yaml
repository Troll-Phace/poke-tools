# poke-tools eval harness — known-answer regression suite (PLAN.md §5)
#
# Model-free. Every case calls a tool directly and checks a known answer. This is
# what catches Bulbapedia template drift and ingest regressions *before* they turn
# into confidently wrong team advice.
#
# Written up front on purpose (PLAN.md §6.8): cases for tools that do not exist yet
# SKIP rather than fail, and light up automatically as each tool lands. A skip is
# reported distinctly from a pass — see tests/test_evals.py.
#
# Case schema:
#   name    — stable, human-readable id (used as the pytest test id)
#   tool    — must be a tool named in PLAN.md §1.3; enforced by a meta-test
#   args    — flat kwargs passed straight to the tool (PLAN.md §0.4: no nesting)
#   expect  — one or more of:
#               contains   list of row-subsets (dicts) or substrings (strings)
#               count      exact number of result rows
#               all_legal  boolean, for can_learn
#               fields     exact equality on named top-level response fields
#               max_bytes  serialized result must not exceed this size
#               source_not "silently-empty" — result must not be an empty list
#                          presented as a complete answer
#   why     — free text: what regression this case exists to catch

cases:
  # --- Tier 1: learnsets, the two launch games -----------------------------

  - name: typhlosion_hgss_tms_include_flamethrower
    tool: get_learnset
    args: { pokemon: typhlosion, game: heartgold-soulsilver, methods: [machine] }
    expect:
      contains:
        - { move: flamethrower, tm: "TM35" }
    why: >-
      Phase 1 exit criterion. Proves TM *numbers* resolve, not just move names —
      machine_number → TM/HM naming per PLAN.md §0.6.4 (n <= 100 → TMnn).

  - name: gible_emerald_egg_moves_fail_cleanly
    tool: get_learnset
    args: { pokemon: gible, game: emerald, methods: [egg] }
    expect:
      count: 0
    why: >-
      Gible is Gen 4 and does not exist in Emerald. Out-of-scope queries must
      return an empty typed result, never raise. Clean failure, not a crash.

  - name: swampert_emerald_egg_moves_walk_to_mudkip
    tool: get_learnset
    args: { pokemon: swampert, game: emerald, methods: [egg] }
    expect:
      contains:
        - { move: curse }
    why: >-
      Base-form walk (PLAN.md §0.2). Egg moves attach to the base species, so
      Swampert's egg moves live on Mudkip. Without the evolves_from_species walk
      this returns zero rows and looks like a legitimately empty answer.

  - name: salamence_emerald_legal_moveset
    tool: can_learn
    args:
      pokemon: salamence
      moves: [earthquake, dragon-claw, brick-break, fly]
      game: emerald
    expect:
      all_legal: true
    why: >-
      The positive control for the cross-gen case below. If version-group
      filtering is *over*-tight, this goes false and the guard is useless.

  - name: salamence_emerald_rejects_draco_meteor
    tool: can_learn
    args: { pokemon: salamence, moves: [draco-meteor], game: emerald }
    expect:
      all_legal: false
    why: >-
      *** HIGHEST-VALUE CASE IN THE SUITE (PLAN.md §5). ***
      Draco Meteor is a Gen 4 tutor move. If version-group filtering leaks across
      generations, this returns legal, reads as entirely plausible, and makes the
      whole team builder untrustworthy. Do not delete or weaken this case.

  - name: salamence_emerald_rock_slide_is_an_emerald_only_tutor
    tool: can_learn
    args: { pokemon: salamence, moves: [rock-slide], game: emerald }
    expect:
      all_legal: true
      contains:
        - { move: rock-slide, legal: true, methods: [tutor] }
    why: >-
      *** Leakage WITHIN generation 3, which every other case here is blind to. ***
      The draco-meteor case catches a leak across generations, where the wrong
      answer at least comes from a different era. This one catches the quieter
      shape: Emerald is version group 6 and Ruby/Sapphire is 5, same generation,
      same species, near-identical learnsets — except the Battle Frontier tutors,
      which are Emerald's alone. Rock Slide is not a TM in generation 3, so a
      Salamence gets it from an Emerald tutor and nowhere else.
      Found by mutation: rebinding Emerald's version group to 5 left every Tier-1
      learnset test green except one paging test that caught it by accident.
      `methods: [tutor]` is asserted, not just `all_legal`, because a leak that
      relabels the row is the same defect wearing a legal verdict.

  - name: salamence_hgss_accepts_draco_meteor
    tool: can_learn
    args: { pokemon: salamence, moves: [draco-meteor], game: heartgold-soulsilver }
    expect:
      all_legal: true
    why: >-
      Positive control for the cross-gen case above. A version-group filter that
      rejects everything would make that guard pass while breaking the tool; this
      is what stops "no move is ever legal" from reading as a green suite.

  - name: swampert_emerald_egg_source_is_reported
    tool: get_learnset
    args: { pokemon: swampert, game: emerald, methods: [egg] }
    expect:
      fields: { egg_moves_from: mudkip, source: pokeapi }
    why: >-
      The base-form walk must be *disclosed*, not just performed. A reader has to
      be able to tell which species the egg moves were read from — that field is
      the only thing distinguishing a correct walk from a walk into a species
      that does not exist in this game.

  - name: crobat_emerald_egg_moves_walk_two_stages
    tool: get_learnset
    args: { pokemon: crobat, game: emerald, methods: [egg] }
    expect:
      fields: { egg_moves_from: zubat }
    why: >-
      The walk must be general, not special-cased for Mudkip, and must not stop
      after one hop — Golbat has no egg rows of its own, so a single-hop walk
      returns an empty list that reads as a legitimate answer.

  # --- Egg moves are the UNION of the pre-evolution chain ------------------
  #
  # Settled against the data, not assumed. Every member of the line that exists
  # in the queried generation contributes its egg list; the answer is the union.
  # Both naive readings lose real moves, and each looks correct on its own.
  # Verified against Bulbapedia's per-species breeding sections:
  #   Marill Gen III 13 = marill 8 U azurill 5   (disjoint)
  #   Marill Gen IV  17 = marill 12 U azurill 7  (2 shared)
  #   Snorlax Gen IV 10 = snorlax 9 U munchlax 9 (8 shared)

  - name: snorlax_hgss_egg_moves_are_the_union_of_the_line
    tool: get_learnset
    args: { pokemon: snorlax, game: heartgold-soulsilver, methods: [egg] }
    expect:
      count: 10
      contains:
        - { move: fissure, egg_source: snorlax }
        - { move: zen-headbutt, egg_source: munchlax }
    why: >-
      *** The best single case for the union rule. It fails under BOTH naive
      implementations. *** Base-only returns Munchlax's nine and drops Fissure,
      which only Snorlax lists. Queried-species-only returns Snorlax's nine and
      drops Zen Headbutt, which only Munchlax lists. Ten rows with both moves
      present is reachable only by unioning the chain — and because the two lists
      share eight moves, a union that forgot to dedupe reports eighteen.
      The egg_source on each row is what proves the union rather than a coincidence.

  - name: marill_emerald_egg_union_is_thirteen
    tool: get_learnset
    args: { pokemon: marill, game: emerald, methods: [egg] }
    expect:
      count: 13
    why: >-
      Marill's Emerald list (8) and Azurill's (5) are disjoint, so the union is
      13 — and Marill carrying its own list alongside Azurill's is what proves a
      species is not dropped from the answer just because it has a baby form.

  - name: marill_hgss_egg_union_is_not_a_sum
    tool: get_learnset
    args: { pokemon: marill, game: heartgold-soulsilver, methods: [egg] }
    expect:
      count: 17
    why: >-
      Pairs with the Emerald case above, which alone cannot distinguish a union
      from a concatenation because its two lists are disjoint. Here Marill's 12
      and Azurill's 7 share two moves: the union is 17 where a sum is 19. Both
      counts must hold or the dedup is wrong in one direction or the other.

  - name: snorlax_emerald_does_not_walk_into_munchlax
    tool: get_learnset
    args: { pokemon: snorlax, game: emerald, methods: [egg] }
    expect:
      count: 6
      fields: { egg_moves_from: null }
    why: >-
      The generation gate on the walk (PLAN.md §0.2). Munchlax is Gen 4 and has
      zero Emerald egg rows, so a generation-blind walk reports "egg moves from
      munchlax" and returns nothing — a species that does not exist in the game,
      named as the source of an empty answer. Eight Emerald species hit this:
      Chansey, Blissey, Snorlax, Mantine, Mr. Mime, Sudowoodo, Roselia, Chimecho.

  - name: blissey_emerald_walk_stops_one_rung_down_at_chansey
    tool: get_learnset
    args: { pokemon: blissey, game: emerald, methods: [egg] }
    expect:
      count: 5
      fields: { egg_moves_from: chansey }
    why: >-
      The generation gate must stop the walk at the right rung, not stop it
      early. Snorlax and Mantine bottom out at themselves, so for them a walk
      that never moved would also pass. Blissey's chain really does descend — to
      Chansey, which exists in Gen 3 — and must not continue to Happiny, which
      does not. Blissey has zero egg rows of its own, so all five come from Chansey.

  - name: pikachu_emerald_egg_moves_come_from_pichu
    tool: get_learnset
    args: { pokemon: pikachu, game: emerald, methods: [egg] }
    expect:
      count: 7
      fields: { egg_moves_from: pichu }
    why: >-
      PokeAPI drops a species' egg list when it is not itself hatchable: Pikachu,
      Clefairy and Jigglypuff have zero egg rows in every version group while
      Pichu, Cleffa and Igglybuff carry theirs. A queried-species-only reading
      returns an empty list for three of the most commonly used Pokemon in the games.

  - name: azumarill_emerald_names_both_contributing_species
    tool: get_learnset
    args: { pokemon: azumarill, game: emerald, methods: [egg] }
    expect:
      count: 13
      contains:
        - { egg_source: marill }
        - { egg_source: azurill }
    why: >-
      egg_moves_from can only name one species, so per-row egg_source is the only
      thing that makes union provenance honest. Azumarill draws from both Marill
      and Azurill; a reader seeing only egg_moves_from: azurill would conclude all
      thirteen are Azurill's, when eight are Marill's and unobtainable from an
      Azurill that never evolved.

  # --- C3: a TM label on a row that no TM teaches --------------------------

  - name: psyduck_emerald_psychic_carries_no_tm
    tool: can_learn
    args: { pokemon: psyduck, moves: [psychic], game: emerald }
    expect:
      all_legal: true
      contains:
        - { move: psychic, tm: null }
    why: >-
      The `machines` table records only that SOME TM in this game teaches a move,
      not that this Pokemon can use it. A join missing the learn-method predicate
      hands that TM's label to every egg, tutor and level-up row for the same
      move — 27 such rows in Emerald, 38 in HGSS. "Psyduck learns Psychic — TM29"
      is a sentence a model repeats verbatim, and it sends the player to buy a TM
      that will not work. all_legal stays true: the move IS learnable, just not by TM.

  - name: feebas_emerald_light_screen_carries_no_tm
    tool: can_learn
    args: { pokemon: feebas, moves: [light-screen], game: emerald }
    expect:
      all_legal: true
      contains:
        - { move: light-screen, tm: null }
    why: >-
      Second instance of the same defect on a different species, so a fix that
      special-cases one row is still caught.

  - name: psyduck_emerald_egg_row_for_psychic_carries_no_tm
    tool: get_learnset
    args: { pokemon: psyduck, game: emerald, methods: [egg] }
    expect:
      contains:
        - { move: psychic, method: egg, tm: null }
    why: >-
      The get_learnset half of psyduck_emerald_psychic_carries_no_tm, and NOT
      redundant with it. Two independent things suppress the spurious label: the
      `machines` join carries a learn-method predicate, and can_learn's verdict
      builder filters to machine rows in Python. Measured by mutation, breaking
      either one alone leaves the can_learn case green — so only asserting on
      both tools catches a single-layer regression.

  - name: feebas_emerald_egg_row_for_light_screen_carries_no_tm
    tool: get_learnset
    args: { pokemon: feebas, game: emerald, methods: [egg] }
    expect:
      contains:
        - { move: light-screen, method: egg, tm: null }
    why: >-
      Same pairing for Feebas. Light Screen has an Emerald TM (TM16) and Feebas
      learns it only by breeding, so a method-blind join labels the egg row TM16.

  # --- The two tools must agree --------------------------------------------

  - name: snorlax_hgss_can_learn_agrees_on_both_union_halves
    tool: can_learn
    args:
      pokemon: snorlax
      moves: [fissure, zen-headbutt]
      game: heartgold-soulsilver
    expect:
      all_legal: true
      contains:
        - { move: fissure, egg_source: snorlax }
        - { move: zen-headbutt, egg_source: munchlax }
    why: >-
      can_learn is PLAN.md §0.4's hallucination guard, and a guard that answers a
      different question from get_learnset is worse than no guard — it launders a
      wrong answer through something that looks like verification. This is the
      same union assertion as snorlax_hgss_egg_moves_are_the_union_of_the_line,
      posed to the other tool: both halves of the union must come back legal with
      the same per-row provenance. When the two had separate SQL they disagreed
      about Marill's Emerald egg moves in opposite directions.

  - name: swampert_emerald_can_learn_agrees_on_the_inherited_egg_move
    tool: can_learn
    args: { pokemon: swampert, moves: [curse], game: emerald }
    expect:
      all_legal: true
      contains:
        - { move: curse, egg_source: mudkip }
    why: >-
      The base-form walk has to hold on the can_learn side too. Curse is
      Mudkip's, not Swampert's; a can_learn that skipped the walk calls a legal
      moveset illegal, which is the failure mode that makes a team builder
      useless in the opposite direction from a cross-gen leak.

  # --- Gen-correct move values: the move_changelog backwards walk (§0.6.2) ---
  #
  # PLAN.md §0.6.2 says reversing this walk "yields plausible, wrong numbers
  # rather than an error" and asks for its own eval. Every expectation below was
  # checked against actual game history, not transcribed from the implementation.

  - name: dig_is_60_bp_in_emerald
    tool: get_move
    args: { move: dig, game: emerald }
    expect:
      fields: { power: 60, differs_from_latest: true }
    why: >-
      Dig was 100 BP in Gen 1, 60 in Gen 2-3, 80 from Gen 4 on. Reversing the
      changelog walk returns 100 here — a real base power from the wrong decade,
      with nothing anywhere raising.

  - name: dig_is_80_bp_in_hgss
    tool: get_move
    args: { move: dig, game: heartgold-soulsilver }
    expect:
      fields: { power: 80, differs_from_latest: false }
    why: >-
      HGSS is after the Gen 4 buff, so no rollback applies and the current value
      stands. Pairs with the Emerald case to pin both branches of the walk.

  - name: petal_dance_is_70_bp_in_emerald
    tool: get_move
    args: { move: petal-dance, game: emerald }
    expect:
      fields: { power: 70, pp: 20 }
    why: >-
      Petal Dance was 70 BP / 20 PP in Gen 1-3, 90/20 in Gen 4, 120/10 from Gen 5.
      The PP here comes from a *different, later* changelog row than the power,
      so this case also fails if the walk is per-row instead of per-field.

  - name: petal_dance_is_90_bp_in_hgss
    tool: get_move
    args: { move: petal-dance, game: heartgold-soulsilver }
    expect:
      fields: { power: 90, pp: 20 }
    why: >-
      *** The two launch games must DISAGREE here (70 vs 90). ***
      No version-group-insensitive implementation can satisfy both this case and
      the Emerald one. Do not "simplify" either away.

  - name: thunder_power_rolls_back_but_effect_chance_does_not
    tool: get_move
    args: { move: thunder, game: emerald }
    expect:
      fields: { power: 120, effect_chance: 30 }
    why: >-
      Thunder's power comes from a Gen 6 change-point (120 BP through Gen 5)
      while its paralysis chance stays at today's 30% — the Gen 1 row naming
      effect_chance sits *before* Emerald. Only a genuinely per-field walk
      produces (120, 30); any per-row walk drags the Gen 1 10% along.

  - name: bite_is_dark_in_emerald
    tool: get_move
    args: { move: bite, game: emerald }
    expect:
      fields: { type: dark, differs_from_latest: false }
    why: >-
      Bite was Normal in Gen 1 and Dark from Gen 2. Its only changelog row
      predates Emerald, so nothing applies — and differs_from_latest must stay
      false rather than being set because the move merely *has* history.

  - name: draco_meteor_is_unavailable_in_emerald_not_absent
    tool: get_move
    args: { move: draco-meteor, game: emerald }
    expect:
      fields: { available_in_game: false }
    why: >-
      A Gen 4 move exists in the moves table regardless of the game asked about.
      available_in_game is the only thing stopping its card from reading as an
      Emerald move's card.

  # --- Gen-correct species values: the three *_past overlays ----------------

  - name: clefable_is_normal_in_hgss_not_fairy
    tool: find_pokemon
    args: { pokemon: clefable, game: heartgold-soulsilver }
    expect:
      fields: { types: [normal] }
    why: >-
      The regression that prompted pokemon_types_past. Fairy did not exist until
      Gen 6. This value flows straight into type-coverage advice, so a Fairy
      Clefable makes every resistance calculation for an HGSS team wrong while
      looking entirely reasonable.

  - name: jigglypuff_hgss_typing_is_whole_list_replaced
    tool: find_pokemon
    args: { pokemon: jigglypuff, game: heartgold-soulsilver }
    expect:
      fields: { types: [normal] }
    why: >-
      pokemon_types_past is a whole-list replacement, not a per-slot merge.
      Jigglypuff's Gen 5 row lists only slot 1 (Normal) against a current
      Normal/Fairy; a per-slot merge leaves Fairy attached and returns
      [normal, fairy].

  - name: butterfree_hgss_special_attack_is_80
    tool: find_pokemon
    args: { pokemon: butterfree, game: heartgold-soulsilver }
    expect:
      contains: ['"special_attack": 80']
    why: >-
      pokemon_stats_past is a per-stat override. Butterfree's SpA was 80 through
      Gen 5 and 90 after, recorded as one row — whole-list replacement would
      leave Butterfree with a single stat and zeroes elsewhere.

  - name: typhlosion_hgss_has_no_hidden_ability
    tool: find_pokemon
    args: { pokemon: typhlosion, game: heartgold-soulsilver }
    expect:
      fields: { types: [fire] }
      contains: ["hidden abilit"]
    why: >-
      Typhlosion has zero pokemon_abilities_past rows, so the overlay alone
      leaves Flash Fire — a Gen 5 Dream World ability — on a Gen 4 card. The
      FIRST_HIDDEN_ABILITY_GENERATION rule removes it, and PLAN.md §3.9 requires
      the omission be disclosed rather than silent, hence the note check.

  # --- Tier 2: the "where" questions PokeAPI cannot answer ------------------

  - name: leftovers_acquisition_from_bulbapedia
    tool: wiki_lookup
    args: { page: "Leftovers", section_name: "Acquisition" }
    expect:
      max_bytes: 6000
      contains: ["Snorlax"]
      not_contains: ["{{", "[[", "'''"]
      source_not: "silently-empty"
      fields:
        row_kind: item_availability
        confidence: partial
    why: >-
      Item acquisition has no PokeAPI field of any kind (PLAN.md §0.2). Also
      max_bytes is 6000 rather than the 8000 used elsewhere BECAUSE THIS IS ONE OF
      THE TWO ANSWERS PLAN.md §2's phase-3 exit criterion NAMES ("where do I get
      Leftovers in HeartGold"), and 6 KB is the figure that criterion sets. It
      measures ~3.2 KB live, so this is a regression guard with real headroom, not
      a tripwire. Note the 6 KB bound belongs to these two criterion answers and
      NOT to wiki_lookup generally — ordinary sections legitimately exceed it
      (Rare Candy § Acquisition ~9.4 KB), and the general bound on a Tier 2 answer
      is the 40-row cap plus this file's per-query max_bytes.
      Also guards the response-size discipline: section-scoped, parsed, never raw
      wikitext crossing the tool boundary (PLAN.md §6.7) — hence the not_contains
      on the three commonest markup shapes, asserted here as well as in the
      unit-level sweep because this is the case that runs against the LIVE page
      and so is the one that catches upstream template drift.
      `partial` is the correct grade and not a hedge: Leftovers has TWO sections
      named "Acquisition" — the core-series one and a Pokemon Pokopia one — and
      the tool takes the first in document order. Grading that `high` would
      present a choice between two sections as though there had been one.

  - name: hgss_move_tutor_section
    tool: wiki_lookup
    args: { page: "Move Tutor", section_name: "HeartGold and SoulSilver" }
    expect:
      max_bytes: 8000
      source_not: "silently-empty"
      fields:
        row_kind: tutor
        confidence: high
        total_count: 56
    why: >-
      Tutor NPC locations and Heart Scale costs are absent from PokeAPI. Section
      *indexes* are unstable across pages (PLAN.md §0.1) — this case fails if the
      resolver ever regresses to hardcoded indexes. total_count is pinned at 56
      against a 40-row cap: the answer and the page are genuinely different sizes,
      and a truncated tutor list reading as the complete one is how "no tutor
      teaches that" becomes a confident wrong answer.

  - name: emerald_tutors_answer_the_earthquake_question_by_absence
    tool: wiki_lookup
    args: { page: "Move Tutor", section_name: "Emerald" }
    expect:
      max_bytes: 6000
      count: 30
      contains:
        - { move: "Swords Dance", cost: "48 BP" }
        - { move: "Softboiled", cost: "16 BP", location: "Battle Frontier", group: "Left Tutor" }
        - "methods=['machine']"
      not_contains:
        - { move: earthquake }
      source_not: "silently-empty"
    why: >-
      *** PLAN.md §2's phase-3 exit criterion asks a question with a FALSE
      PREMISE. *** "Which Emerald Battle Frontier tutor teaches Earthquake and
      what does it cost" has no answer: no Emerald tutor teaches Earthquake, it
      is TM26. The tool answers correctly by returning all 30 tutors plus a note
      that a move absent from the list is not taught here, pointing at
      get_learnset with methods=['machine'].
      Both halves are load-bearing and neither works alone. Without not_contains
      a leaked TM row or a Gen 4 tutor row would satisfy the case. Without the
      count, "Earthquake is absent" is trivially true of an empty result — the
      same false green a hallucinating model would produce by refusing to answer.
      The BP cost is pinned because it comes from tutormv/header state that a row
      read in isolation does not carry, and cost is half of what was asked.
      The Softboiled row pins all four fields together because they arrive by four
      different routes and only the set answers the question: the move from the
      tutormv call, the cost from the enclosing tutormv/header, the LOCATION from
      the "Battle Frontier Move Tutors" SUBHEADING, and the group from that
      header's disp= label. PLAN.md §0.2 names tutor NPC locations as a headline
      reason this tier exists; when location and group were the same variable, the
      more specific disp= won and all 20 Frontier rows came back with no location
      at all — an answer that still carried a move and a price and so looked
      complete. This is also the live drift detector for the venue: an editor
      renaming that subheading changes the answer and must fail here.
      max_bytes is 6000 rather than 8000 because this is the SECOND of the two
      answers §2's phase-3 criterion names. It measures ~4.9 KB live.

  # --- Coverage honesty ----------------------------------------------------

  - name: feebas_emerald_reports_coverage_gap
    tool: where_to_find
    args: { pokemon: feebas, game: emerald }
    expect:
      source_not: "silently-empty"
    why: >-
      Emerald has ~1,647 encounter rows vs HGSS's 6,205 (PLAN.md §0.2), and Feebas
      is condition-gated. A thin-data answer must be reported as low-confidence or
      fallen through to Bulbapedia — never returned as a complete empty list.
      PLAN.md §3.9: silent gap-filling is how a team builder confidently
      recommends a Pokemon you cannot catch.

  - name: feebas_emerald_is_partial_not_high
    tool: where_to_find
    args: { pokemon: feebas, game: emerald }
    expect:
      count: 1
      contains:
        - { location: "Route 119", method: feebas-tile-fishing }
      fields:
        confidence: partial
    why: >-
      Thin *and* non-empty is the interesting case. The row above is real, so the
      easy hedge — "empty results get a caveat" — does not apply; the answer must
      still be graded `partial` because Emerald's 1,647 encounter rows against
      HGSS's 6,205 mean absence of a row is not evidence of absence in the game
      (PLAN.md §0.2, §3.9). `high` here would be the Tier-1 gap-filling §3.9
      forbids, expressed as a claim rather than as data.

  - name: gible_emerald_is_a_complete_empty_answer
    tool: where_to_find
    args: { pokemon: gible, game: emerald }
    expect:
      count: 0
      fields:
        confidence: high
      source_not: "silently-empty"
    why: >-
      The one empty result that earns `high`. Gible is Generation 4, so "you cannot
      catch it in Emerald" is complete, not a coverage gap — grading it `low` would
      hedge a fact the data fully settles. It still carries a coverage_note, which
      is what `source_not` checks: an empty list with no explanation is
      indistinguishable from a lookup that quietly failed.

  - name: milotic_emerald_is_low_not_high
    tool: where_to_find
    args: { pokemon: milotic, game: emerald }
    expect:
      count: 0
      fields:
        confidence: low
      source_not: "silently-empty"
    why: >-
      The contrast that keeps `high`-on-empty narrow. Milotic exists in Emerald —
      it is Feebas's evolution — but has no encounter row because it is
      evolution-only. Same zero rows as the Gible case, opposite meaning: "this
      server does not know where", never "you cannot get it". A grading rule that
      keys on emptiness alone gets one of these two wrong.

  # --- The HGSS two-version encounter collapse (PLAN.md §0.6.3) ------------

  - name: growlithe_hgss_is_heartgold_exclusive
    tool: where_to_find
    args: { pokemon: growlithe, game: heartgold-soulsilver }
    expect:
      contains:
        - { location: "Route 36", min_level: 13, rarity_percent: 10, versions: [heartgold] }
    why: >-
      Two properties in one row. `versions: [heartgold]` is the version-exclusive
      annotation surviving the collapse — a dedupe that drops the version column
      keeps the row and loses the fact, turning "Growlithe is HeartGold-only" into
      "Growlithe is in HGSS". `rarity_percent: 10` is the per-version rarity sum
      over Route 36's two 5% slots; reporting 5 means the sum was dropped.

  - name: unown_hgss_rarity_does_not_cross_versions
    tool: where_to_find
    args: { pokemon: unown, game: heartgold-soulsilver }
    expect:
      count: 4
      contains:
        - { rarity_percent: 100, versions: [heartgold, soulsilver] }
    why: >-
      Unown holds twelve encounter slots at each Ruins of Alph chamber in *both*
      versions — 24 raw rows summing to 200%. The truthful answer is 100%: slots
      are disjoint outcomes of one roll within a version, and the two versions are
      alternatives, not additions. A rarity sum that groups before splitting on
      version reports a rate that is not merely wrong but impossible. The count of
      4 is the second half: one row per chamber, not one per version per chamber.

  - name: mareep_hgss_condition_alternatives_stay_separate
    tool: where_to_find
    args: { pokemon: mareep, game: heartgold-soulsilver }
    expect:
      contains:
        - { location: "Route 32", min_level: 6, conditions: [radio-off, time-morning] }
        - { location: "Route 32", min_level: 6, conditions: [radio-off, time-day] }
    why: >-
      `conditions` is a straight AND, so alternatives must be separate rows.
      Mareep sits in Route 32 slot 5 twice, once in the morning table and once in
      the day table; merging them on the natural key and unioning the conditions
      yields [radio-off, time-day, time-morning] on one row, which reads as a
      conjunction and is false as one — no encounter requires it to be both
      morning and day. This case fails the moment the condition set leaves the
      grouping key.

  # --- list_obtainable: badge scoping is approximate and says so (§3.8) ----

  - name: emerald_before_badge_four_is_level_appropriate
    tool: list_obtainable
    args: { game: emerald, badges: 3 }
    expect:
      fields:
        total_count: 116
        level_cap: 29
        approximate: true
      contains:
        - { pokemon: poochyena, min_level: 2, location: "Route 101" }
    why: >-
      PLAN.md §2's Phase 2 exit criterion. badges=3 is "before the fourth badge".
      LEVEL_CAPS is hand-curated — nothing upstream carries trainer levels or badge
      order — so `approximate: true` and the level_cap being reported at all are
      what make it defensible under §3.8. A scope filter the reader cannot see is a
      filter they cannot correct for.

  - name: hgss_walk_filter_returns_rows
    tool: list_obtainable
    args: { game: heartgold-soulsilver, badges: 3, method: walk }
    expect:
      source_not: "silently-empty"
    why: >-
      Regression guard for a caught silent-zero-rows bug. `_scoped_cte` used to
      leave the caller to append the level cap, which put it *before* the method
      filter's parameters in the bound sequence; SQLite then compared a method
      identifier against a level and matched nothing. Zero rows, no error, no
      warning. A bug that returns a confident empty list deserves a permanent case.

  - name: emerald_headbutt_is_empty_and_says_nothing_matched
    tool: list_obtainable
    args: { game: emerald, badges: 0, method: headbutt }
    expect:
      count: 0
      fields:
        confidence: low
      source_not: "silently-empty"
    why: >-
      The only empty answer either launch game produces, and it shipped graded
      wrong. `list_obtainable` graded Emerald `partial` *before* checking whether
      anything matched, which made the zero-row branch unreachable for Emerald: the
      game with a quarter of HGSS's encounter coverage answered an identical empty
      question with the *more* confident grade and never said that nothing matched.
      `low` plus a note that leads with "nothing matched" is the fix; `partial` on
      zero rows is a claim that an incomplete list exists when none does.

  - name: emerald_page_past_the_end_keeps_the_answers_grade
    tool: list_obtainable
    args: { game: emerald, badges: 8, method: any, offset: 10000 }
    expect:
      count: 0
      fields:
        total_count: 153
        confidence: partial
      source_not: "silently-empty"
    why: >-
      A rowless *page* of a non-empty *answer*. Both graders key on `total_count`,
      so this response is graded exactly as page zero was — `partial`, with the
      thin-Emerald caveat — and that is honest. The honesty assertion used to key
      emptiness on `len(rows)` instead, which made this case, and every paginated
      case anyone might add after it, red while naming no code defect. Kept as a
      case so the corrected rule is exercised rather than only correct.

  - name: hgss_page_past_the_end_does_not_acquire_a_hedge
    tool: where_to_find
    args: { pokemon: zubat, game: heartgold-soulsilver, offset: 10000 }
    expect:
      count: 0
      fields:
        total_count: 100
        confidence: high
        coverage_note: null
      source_not: "silently-empty"
    why: >-
      The other side of the same rule. A fully-covered answer paged past its end
      must stay `high` with no `coverage_note` — under the old `len(rows)` reading
      this tripped the null-note clause, i.e. a complete answer was reported as
      silently empty purely because the caller asked for a page that does not
      exist.

  # --- where_to_find's method filter: truncation is method-shaped ----------

  - name: magikarp_hgss_is_surfable
    tool: where_to_find
    args: { pokemon: magikarp, game: heartgold-soulsilver, method: surf }
    expect:
      count: 35
      fields:
        total_count: 35
      source_not: "silently-empty"
    why: >-
      The blind spot the `method` filter closes. Rows sort by
      `encounter_methods."order"`, so methods are *contiguous* and the 40-row cap
      truncates whole methods rather than sampling across them: Magikarp has 261
      HGSS rows, old-rod fills all of page 1, and surf does not start until index
      226 — page 6. A model asking "can I surf up a Magikarp" read page 1 and
      concluded, plausibly and wrongly, that it could not. The filter must return
      all 35 surf rows on page 1, and 226 fishing + 35 surf must still sum to 261:
      a filter that partitions is correct, one that drops looks identical here.

  - name: magikarp_hgss_headbutt_miss_does_not_claim_it_is_unfindable
    tool: where_to_find
    args: { pokemon: magikarp, game: heartgold-soulsilver, method: headbutt }
    expect:
      count: 0
      fields:
        confidence: low
      contains: ["re-run with method='any'"]
      source_not: "silently-empty"
    why: >-
      A filtered miss and a real miss are different claims. Magikarp cannot be
      headbutted out of a tree and is one of the easiest Pokémon in HGSS to catch,
      so the unfiltered sentence — "No encounter is recorded for Magikarp in
      heartgold-soulsilver" — would be flatly false, and it is the sentence a model
      quotes back. The note must name the filter and hand back the escape hatch.
      `low` is asserted too: a narrower question is not a more certain one.

  # --- get_item: held_by, and the three-valued availability verdict --------

  - name: leftovers_hgss_names_its_wild_holders
    tool: get_item
    args: { item: leftovers, game: heartgold-soulsilver }
    expect:
      fields:
        held_by:
          - { pokemon: munchlax, rarity_percent: 100, versions: [heartgold, soulsilver] }
          - { pokemon: snorlax, rarity_percent: 100, versions: [heartgold, soulsilver] }
    why: >-
      The one acquisition route PokéAPI records at all (PLAN.md §1.3's held-by-wild
      rarity clause) — not a location, but a Pokémon: catch a Snorlax. Pinned with
      the rate and the versions, because a holder without a rate is not an
      actionable answer and `pokemon_items` keys on `version_id`, so an unscoped
      query reports holders from every game.

  - name: leftovers_emerald_drops_the_gen_four_holder
    tool: get_item
    args: { item: leftovers, game: emerald }
    expect:
      fields:
        held_by:
          - { pokemon: snorlax, rarity_percent: 100, versions: [emerald] }
    why: >-
      The version scoping, on the one item where dropping it is visible. Munchlax
      is a Generation 4 species and cannot be caught in Emerald at all, so listing
      it here would be a real Pokémon at a real rate with an impossible
      instruction attached — a confident wrong answer of exactly the §3.9 kind.

  - name: life_orb_does_not_exist_in_emerald
    tool: get_item
    args: { item: life-orb, game: emerald }
    expect:
      fields:
        available_in_game: false
      contains: ["does not exist in emerald"]
    why: >-
      Every field on an item card except `tm` is generation-agnostic, so a Gen 4
      item asked about in Emerald came back as a clean card stamped `game: emerald`
      with an empty `notes` list — an affirmative assertion of something false
      rather than an omission. Life Orb is the first item a competitively-primed
      model reaches for. The verdict and the sentence are both pinned: a bare
      boolean in a field a model may not read is not a disclosure.

  - name: choice_band_does_exist_in_emerald
    tool: get_item
    args: { item: choice-band, game: emerald }
    expect:
      fields:
        available_in_game: true
    why: >-
      The control that keeps `false` from meaning "anything competitive in a Gen 3
      game". Choice Band is Generation 3 and genuinely there, so a check that
      denied every held item would fail here rather than look appropriately strict.

  - name: oaks_parcel_availability_is_unknown_not_denied
    tool: get_item
    args: { item: oaks-parcel, game: emerald }
    expect:
      fields:
        available_in_game: null
      contains: ["is unknown here", "not denied"]
    why: >-
      *** The §3.9 trap pointing the other way. *** 48 reachable identifiers carry
      no `item_game_indices` row of any generation. `_availability` returns `false`
      only when the item has rows for some *other* generation; no rows at all is
      `null` plus an unknown-not-denied note. Collapsing `null` into `false` — the
      obvious one-line simplification, and the shape the field takes the moment
      someone types it `bool` — manufactures 48 false "this item does not exist in
      Emerald" claims, which is the same invented-fact error the field exists to
      prevent. `fields` compares this one by identity, so `false` cannot satisfy it.

      The `contains` half pins the note's *distinguishing* phrasing rather than the
      bare word "unknown", which occurs exactly once today but would keep this case
      green for the wrong reason the moment any other note said "unknown location".
      Two halves that check two different things: the field, and the sentence that
      explains it.

  - name: tm92_emerald_explains_both_its_null_fields
    tool: get_item
    args: { item: tm92, game: emerald }
    expect:
      fields:
        available_in_game: false
        tm: null
      contains: ["does not exist in emerald", "machine list"]
    why: >-
      Two notes that look redundant and are not. The availability note frames the
      whole card; the machine note explains one specific null field, since a bare
      null `tm` reads as "this is not a TM at all" — a different and wrong claim.
      The second was once suppressed as redundant when availability already said
      the item was absent, which left a reader asking "why is `tm` empty" to infer
      it from a sentence about generations.

  # --- type_matchup: the *_past walk direction (PLAN.md §0.6.2) ------------

  - name: emerald_steel_resists_dark
    tool: type_matchup
    args: { type1: dark, game: emerald }
    expect:
      fields:
        attacking_not_very_effective: [fighting, steel, dark]
    why: >-
      The two Generation 5 type_efficacy_past rows (ghost->steel 50, dark->steel
      50) are the *only* rows making these games' charts correct, and the *_past
      convention — smallest generation_id >= G — is what selects them for
      Generation 3. Drop the overlay and the tool reports the present-day 1x, which
      is the answer the model already had and the reason this tool exists.

  - name: emerald_poison_is_not_super_effective_against_bug
    tool: type_matchup
    args: { type1: poison, game: emerald }
    expect:
      fields:
        attacking_super_effective: [grass]
    why: >-
      The other direction, and the one most likely to be "fixed" into a bug: the
      intuition that older games need the *older* rows is wrong here. All four
      Generation 1 past rows changed in Generation 2, so none applies to Emerald.
      A walk reverted to pick the largest generation_id <= G selects them and turns
      Poison super effective against Bug — plausible-looking and silent. Its
      sibling failure, Ghost being unable to damage Psychic, is worse.

  - name: hgss_clefable_typing_has_no_fairy_matchup
    tool: type_matchup
    args: { type1: normal, game: heartgold-soulsilver }
    expect:
      fields:
        generation: 4
    why: >-
      Fairy is Generation 6. Listing it as a Normal-type matchup in HeartGold would
      be a confident wrong answer about a matchup the cartridge cannot produce, so
      it never enters the chart at all. The generation field is pinned because a
      gen-correct chart that does not say which generation cannot be checked.

  # --- team_check: composition, honesty, and reporting without ruling ------

  - name: team_check_verdict_matches_can_learn_on_draco_meteor
    tool: team_check
    args:
      team:
        - { pokemon: salamence, moves: [draco-meteor] }
      game: emerald
    expect:
      contains: ["Salamence cannot learn this move in emerald"]
      fields:
        all_moves_legal: false
    why: >-
      The cross-generation leakage case, reached through the *composing* tool. PLAN.md
      §5 calls the direct can_learn version the highest-value eval in the suite; this
      one guards the second way to get it wrong, which is a team report that
      re-derives legality instead of carrying can_learn's own MoveLegality objects.
      The reason string is pinned verbatim because that is the half a reader acts on:
      a report agreeing on `legal` while disagreeing on *why* is the same defect
      wearing a disguise. Phase 1b spent four review rounds on can_learn and
      get_learnset drifting apart; this is the third tool that could join them.

  - name: team_check_does_not_grade_a_finding_as_incomplete
    tool: team_check
    args:
      team:
        - { pokemon: salamence, moves: [draco-meteor] }
      game: emerald
    expect:
      fields:
        confidence: high
        coverage_note: null
    why: >-
      `partial` means the data could not fully answer the question — not that the
      answer contains bad news. Every move being illegal is a *complete* answer, as is
      a species that postdates the game. Grading either `partial` makes the field mean
      "we found problems", and then a genuinely narrowed report — an alternate form
      this server cannot query, an item upstream records nothing for — becomes
      indistinguishable from a healthy team with a flaw. This shipped wrong once: the
      no-moves branch keyed on "no legal damaging move", so a caught illegal move
      degraded the grade *and* attached a note claiming legality was never assessed.

  - name: team_check_reports_the_shared_evolution_line_without_ruling_on_it
    tool: team_check
    args:
      team:
        - { pokemon: gyarados, moves: [waterfall] }
        - { pokemon: magikarp, moves: [splash] }
      game: heartgold-soulsilver
    expect:
      contains:
        - "belong to the same evolution line"
        - "Dupes-clause rulesets differ"
        - "no ruleset is applied here"
      not_contains:
        - "violates"
        - "not allowed"
    why: >-
      PLAN.md §1.3 is emphatic that team_check reports facts and lets the human apply
      their ruleset, because house rules vary too much for a tool to pick one. The
      three positive fragments are the observation stating the fact *and* declining to
      adjudicate it; the two negatives are what a well-meaning edit adds when it
      decides a dupes clause is universal. A bare "they share an evolution line" reads
      as an accusation to someone running one and as noise to someone who is not.

  - name: team_check_carries_the_unknown_item_verdict_up_verbatim
    tool: team_check
    args:
      team:
        - { pokemon: typhlosion, moves: [flamethrower], item: oaks-parcel }
      game: heartgold-soulsilver
    expect:
      contains:
        - "unknown, not no"
        - "get_item:"
      fields:
        confidence: partial
    why: >-
      *** Honesty propagation, on the field where collapsing it invents a fact. ***
      `available_in_game` is three-valued and `null` means upstream records no
      generation index at all — unknown, never denied. get_item earned that
      distinction across 49 items; a team report that flattened it into `false` would
      manufacture "this item does not exist here" out of honest parts, which is
      PLAN.md §3.9's failure exactly. The `get_item:` prefix is pinned too: a caveat
      that arrives without saying which tool said it cannot be re-run or verified.

  - name: team_check_discloses_the_form_it_actually_answered_for
    tool: team_check
    args:
      team:
        - { pokemon: wormadam, moves: [bug-buzz] }
      game: heartgold-soulsilver
    expect:
      contains:
        - "wormadam-plant"
        - "wormadam-trash"
      fields:
        confidence: partial
    why: >-
      Alternate-form support is deferred for v1, so a Wormadam question is answered
      with Wormadam-Plant's rows. That is only acceptable while it is *disclosed*, and
      the disclosure has to survive two tool boundaries to reach here. The grade is
      pinned alongside the prose because the two are meant to be derived from the same
      `db.diverging_forms` call — a confidence sniffed out of note text would drift
      silently the moment either source tool reworded its sentence.

  # --- export_team: paste-ready, and gen-correct by derivation -------------

  - name: export_team_hgss_renders_a_pasteable_party
    tool: export_team
    args:
      team:
        - { pokemon: typhlosion, moves: [flamethrower, earthquake], item: charcoal, ability: blaze, nature: modest, level: 50 }
        - { pokemon: gyarados, moves: [waterfall, ice-fang], item: lum-berry, ability: intimidate }
      game: heartgold-soulsilver
    expect:
      contains:
        - "Typhlosion @ Charcoal"
        - "Ability: Blaze"
        - "Modest Nature"
        - "- Ice Fang"
      max_bytes: 4000
    why: >-
      PLAN.md §2's phase 4 exit criterion is "paste-ready for damage calcs", which is a
      claim about a *format*, not about looking right. Names are resolved through the
      same resolvers every other tool uses, so `ice-fang` comes out as Showdown spells
      it rather than as it was typed — an export that echoes its input produces a paste
      that silently drops a Pokémon on import.

  - name: export_team_flags_a_move_the_listed_level_cannot_have_yet
    tool: export_team
    args:
      team:
        - { pokemon: heracross, moves: [megahorn], level: 48 }
      game: heartgold-soulsilver
    expect:
      contains:
        - "Heracross is listed at level 48"
        - "level-up at 55"
      not_contains:
        - "illegal"
    why: >-
      The one seam the Phase 4 live gate found. Qwen exported a level 48 Heracross
      carrying Megahorn — learned at 55, and level-up is its only route in HGSS — and
      caught the tension in prose while the exported block did not reflect it. The
      observation exists to close that, and the not_contains is the load-bearing half:
      this tool formats and team_check judges, so the moveset is REACHABLE, just not
      yet, and calling it illegal would be a second legality opinion and a wrong one.
      Its silence on TM and egg moves is pinned in tests/test_export_team.py, because
      a caveat that fires on every export is read as boilerplate within a day.

  - name: export_team_omits_tera_and_says_why
    tool: export_team
    args:
      team:
        - { pokemon: swampert, moves: [surf], ability: torrent }
      game: emerald
    expect:
      contains:
        - "Terastallization is generation 9"
      not_contains:
        - "Tera Type:"
    why: >-
      The generation quirks §1.3 names are encoded as floors, not as game names — both
      launch games are Generation 3 or 4, so *every* export in scope omits Tera and
      carries an ability line, which makes a hardcoded "no Tera in HGSS" produce
      byte-identical output to the rule. The absence is stated rather than left silent:
      a reader comparing this against a modern paste notices the missing line, and "the
      mechanic postdates this game" is a better answer than nothing.

  - name: export_team_does_not_emit_the_nidoran_glyph_that_breaks_import
    tool: export_team
    args:
      team:
        - { pokemon: nidoran-f, moves: [tackle] }
        - { pokemon: nidoran-m, moves: [tackle] }
      game: emerald
    expect:
      fields:
        text: "Nidoran-F\n- Tackle\n\nNidoran-M\n- Tackle\n"
    why: >-
      Showdown's toID() lowercases and strips everything outside [a-z0-9], so
      `Nidoran♀` and `Nidoran♂` both collapse to `nidoran` — which is not a species id
      at all; the ids are `nidoranf` and `nidoranm`. Two different Pokémon rendered as
      one unimportable name is a §2 phase 4 exit-criterion breach, and it is invisible
      to a human reading the paste, which looks perfectly correct.

      Scoped to `text` on purpose, and this was a real call. The first version asserted
      the glyph was absent from the *whole serialised response*, which fails a perfectly
      correct paste whose note happens to quote the pokédex name it replaced — and a
      note explaining why a name was rewritten is exactly the honesty this project
      protects everywhere else. The importable-paste property is a property of `text`;
      the response object is not the paste. A guard that fails on correct behaviour
      erodes the suite as surely as one that cannot fail at all.

      The broader "no note anywhere quotes the glyph" invariant is deliberately *not*
      asserted, here or as a separate case: it is not an exit criterion, and pinning it
      would forbid a future note that legitimately names a display form. The underlying
      property — toID of each rendering equals the species id, and the two Nidoran do
      not collapse together — is asserted in tests/test_export_team.py, which can
      compute toID; the YAML layer pins the one rendering that satisfies it.
